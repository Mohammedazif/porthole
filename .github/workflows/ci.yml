name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_payload_run:
        description: Rebuild Windows Setup from another run's Windows payload
        type: string
        default: ''
      windows_ui_only:
        description: Run Windows tests and capture the native desktop screens
        type: boolean
        default: false

jobs:
  linux:
    if: ${{ !inputs.windows_payload_run && !inputs.windows_ui_only }}
    name: Linux (full build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test portable Windows Bluetooth protocol and sender
        run: dotnet run --project helpers/ble-winrt/Tests --configuration Release --artifacts-path build/dotnet-tests

      - name: Install dependencies
        run: sudo ./scripts/install-deps-linux.sh

      - name: Configure
        run: cmake --preset release -DPORTHOLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Build and check the Ubuntu and Linux Mint installer
        run: |
          cpack --config build/release/CPackConfig.cmake -B out/linux
          sudo apt-get install -y ./out/linux/*.deb
          /usr/bin/porthole --version
          test -x /usr/libexec/porthole/porthole_ble.py
          test -f /usr/share/applications/porthole.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: porthole-ubuntu-24.04-mint-22-amd64
          path: out/linux/*.deb
          if-no-files-found: error

  debian:
    if: ${{ !inputs.windows_payload_run && !inputs.windows_ui_only }}
    name: Linux installer (Debian 13)
    runs-on: ubuntu-24.04
    container: debian:13
    defaults:
      run:
        shell: bash
    steps:
      - name: Install checkout tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: bash scripts/install-deps-linux.sh

      - name: Build and check the Debian installer
        run: |
          cmake --preset release -DPORTHOLE_WARNINGS_AS_ERRORS=ON -DPORTHOLE_BUILD_TESTS=OFF
          cmake --build --preset release
          cpack --config build/release/CPackConfig.cmake -B out/linux
          apt-get install -y ./out/linux/*.deb
          /usr/bin/porthole --version
          test -x /usr/libexec/porthole/porthole_ble.py
          test -f /usr/share/applications/porthole.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: porthole-debian-13-amd64
          path: out/linux/*.deb
          if-no-files-found: error

  windows:
    if: ${{ !inputs.windows_payload_run }}
    name: Windows Wi-Fi mirror and Bluetooth (MSYS2 UCRT64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The runner's git sets autocrlf, which writes CRLF into the UxPlay submodule.
      # MSYS2's git does not read that setting, so the packager would see it as modified.
      - name: Check out with LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # git and zstd are for scripts/package-windows.sh (source archives, .pkg.tar.zst).
          install: >-
            git
            zstd
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-ffmpeg

      # ffmpeg pulls sdl2-compat, which drops injected keys and precise wheel deltas.
      - name: Use classic SDL2
        run: |
          if pacman -Q mingw-w64-ucrt-x86_64-sdl2-compat >/dev/null 2>&1; then
            pacman -Rdd --noconfirm mingw-w64-ucrt-x86_64-sdl2-compat
          fi
          curl --fail --location --retry 3 -o /tmp/SDL2-2.32.10.pkg.tar.zst \
            https://mirror.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-SDL2-2.32.10-1-any.pkg.tar.zst
          echo '9e77124b14bedaafbfb44ac26e5fb43890184db23292cebf2251b2178fad6693  /tmp/SDL2-2.32.10.pkg.tar.zst' | sha256sum -c
          pacman -U --noconfirm /tmp/SDL2-2.32.10.pkg.tar.zst
          mkdir -p /var/cache/pacman/pkg
          cp /tmp/SDL2-2.32.10.pkg.tar.zst \
            /var/cache/pacman/pkg/mingw-w64-ucrt-x86_64-SDL2-2.32.10-1-any.pkg.tar.zst
          test "$(pkg-config --modversion sdl2)" = 2.32.10
          test "$(pacman -Qoq "${MINGW_PREFIX}/bin/SDL2.dll")" = mingw-w64-ucrt-x86_64-SDL2

      - name: Configure
        run: cmake --preset windows-release -DPORTHOLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Test Windows Bluetooth sender
        shell: pwsh
        run: dotnet run --project helpers/ble-winrt/Tests --configuration Release --artifacts-path build/dotnet-tests

      - name: Review native Windows desktop screens
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -eo pipefail
          mkdir -p out/windows-ui-review
          build/windows-release/tests/test_window_ui.exe --windows-visual-review out/windows-ui-review \
            2>&1 | tee out/windows-ui-review/validation.log

      - name: Upload Windows visual review
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: porthole-native-windows-review
          path: out/windows-ui-review/
          if-no-files-found: error

      - name: Package portable mirror and matching source archives
        if: ${{ !inputs.windows_ui_only }}
        run: bash scripts/package-windows.sh

      - name: Verify the packaged Windows runtime
        if: ${{ !inputs.windows_ui_only }}
        run: >-
          python scripts/portable-windows/verify_payload.py out/porthole-windows-x64
          --report out/porthole-windows-x64-verification.json

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.windows_ui_only }}
        with:
          name: porthole-windows-x64
          path: out/porthole-windows-x64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.windows_ui_only }}
        with:
          name: porthole-windows-x64-sources
          path: out/porthole-windows-x64-sources/
          compression-level: 0
          if-no-files-found: error

  windows-installer:
    name: Windows Setup installer
    needs: windows
    if: ${{ !cancelled() && !inputs.windows_ui_only && (needs.windows.result == 'success' || inputs.windows_payload_run) }}
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate the selected payload run
        if: ${{ inputs.windows_payload_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_RUN: ${{ inputs.windows_payload_run }}
        run: |
          if ($env:PAYLOAD_RUN -notmatch '^\d+$') { throw 'Expected a numeric workflow run ID' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PAYLOAD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.head_branch -ne $env:GITHUB_REF_NAME) {
            throw 'Select a payload run from this repository and branch'
          }

      - uses: actions/download-artifact@v4
        with:
          name: porthole-windows-x64
          path: out/porthole-windows-x64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_payload_run || github.run_id }}

      - name: Verify the setup payload
        run: >-
          python scripts/portable-windows/verify_payload.py out/porthole-windows-x64
          --report out/porthole-windows-x64-verification.json

      - name: Compile the Windows setup installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $payload = (Resolve-Path 'out\porthole-windows-x64').Path
          $version = (Get-Item (Join-Path $payload 'porthole.exe')).VersionInfo.ProductVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid Porthole version: $version" }
          $destination = (New-Item -ItemType Directory -Force 'out\windows-installer').FullName
          & $compiler "/DBuildDir=$payload" "/DPortholeVersion=$version" "/O$destination" 'packaging\windows\porthole.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed: $LASTEXITCODE" }

      - name: Capture the installer wizard
        shell: powershell
        timeout-minutes: 2
        run: |
          $installer = Get-Item 'out\windows-installer\*-Setup.exe'
          $personalize = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (!(Test-Path $personalize)) { New-Item $personalize -Force | Out-Null }
          $original = (Get-Item $personalize).GetValue('AppsUseLightTheme')
          try {
            Set-ItemProperty $personalize AppsUseLightTheme 1 -Type DWord
            .\tests\windows-setup-review.ps1 -Installer $installer.FullName -OutputDirectory 'out\windows-setup-review\light'
            Set-ItemProperty $personalize AppsUseLightTheme 0 -Type DWord
            .\tests\windows-setup-review.ps1 -Installer $installer.FullName -OutputDirectory 'out\windows-setup-review\dark'
          } finally {
            if ($null -eq $original) {
              Remove-ItemProperty $personalize AppsUseLightTheme
            } else {
              Set-ItemProperty $personalize AppsUseLightTheme $original -Type DWord
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: porthole-windows-setup-review
          path: out/windows-setup-review/**/*.png
          if-no-files-found: error

      - name: Check installation and removal
        shell: pwsh
        run: |
          $installer = Get-Item 'out\windows-installer\*-Setup.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'Porthole installer test'
          $startupShortcut = Join-Path ([Environment]::GetFolderPath('CommonStartup')) 'Porthole.lnk'
          $firewallRules = @('Porthole Installed TCP', 'Porthole Installed UDP', 'Porthole Installed mDNS')
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=startwithwindows',
            ('/DIR="{0}"' -f $destination)
          ) -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installation failed: $($installed.ExitCode)" }
          if (!(Test-Path $startupShortcut)) { throw 'The sign-in option did not install its shortcut' }
          foreach ($name in $firewallRules) {
            if (Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue) {
              throw "Setup created a firewall rule: $name"
            }
          }
          $payload = Get-Content 'out\porthole-windows-x64-verification.json' -Raw | ConvertFrom-Json
          foreach ($file in $payload.files | Where-Object { $_.path -match '\.(exe|dll)$' }) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $destination $file.path)).Hash
            if ($hash -ne $file.sha256) { throw "Installed file differs: $($file.path)" }
          }
          $versionLog = Join-Path $env:RUNNER_TEMP 'porthole-version.txt'
          $app = Start-Process -FilePath (Join-Path $destination 'porthole.exe') -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $versionLog
          $version = Get-Content $versionLog -Raw
          if ($app.ExitCode -ne 0 -or $version -notmatch '^Porthole \d+\.\d+\.\d+') {
            throw "Installed Porthole failed: $($app.ExitCode) $version"
          }
          Write-Output $version.Trim()
          $config = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'Fresh Porthole app data')).FullName
          $env:APPDATA = $config
          $startupLog = Join-Path $env:RUNNER_TEMP 'porthole-startup.txt'
          $app = Start-Process -FilePath (Join-Path $destination 'porthole.exe') `
            -ArgumentList '--no-bluetooth', '--no-usb', '--no-setup' -PassThru -RedirectStandardError $startupLog
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40 -and !$app.HasExited; $attempt++) {
              $listener = Get-NetTCPConnection -LocalPort 47731 -State Listen -OwningProcess $app.Id -ErrorAction SilentlyContinue
              $log = Get-Content $startupLog -Raw
              if ($listener -and $log -match 'photo pull: listening on \d+\.\d+\.\d+\.\d+:47731') {
                $ready = $true
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (!$ready -or !(Test-Path (Join-Path $config 'Porthole\desktop-identity.pem'))) {
              Get-Content $startupLog
              throw 'Fresh installation did not start the LAN pairing service'
            }
            Write-Output 'Fresh installation started the LAN pairing service'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
            $app.WaitForExit()
          }
          $uninstaller = Get-Item (Join-Path $destination 'unins*.exe')
          $removed = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($removed.ExitCode -ne 0 -or (Test-Path (Join-Path $destination 'porthole.exe'))) {
            throw "Uninstallation failed: $($removed.ExitCode)"
          }
          if (Test-Path $startupShortcut) { throw 'Uninstall left the startup shortcut installed' }
          foreach ($name in $firewallRules) {
            if (Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue) {
              throw "Uninstall left the firewall rule installed: $name"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: porthole-windows-x64-setup
          path: out/windows-installer/*-Setup.exe
          compression-level: 0
          if-no-files-found: error

  windows-minimal:
    if: ${{ !inputs.windows_payload_run && !inputs.windows_ui_only }}
    name: Windows minimal CLI
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
      - run: cmake --preset release-no-airplay -DPORTHOLE_WARNINGS_AS_ERRORS=ON
      - run: cmake --build --preset release-no-airplay
      - run: ctest --preset release-no-airplay
