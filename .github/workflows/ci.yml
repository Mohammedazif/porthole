name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (full build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test portable Windows Bluetooth protocol and sender
        run: dotnet run --project helpers/ble-winrt/Tests --configuration Release --artifacts-path build/dotnet-tests

      - name: Install dependencies
        run: sudo ./scripts/install-deps-linux.sh

      - name: Configure
        run: cmake --preset release -DPORTHOLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  windows:
    name: Windows Wi-Fi mirror and Bluetooth (MSYS2 UCRT64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-ffmpeg

      # ffmpeg pulls sdl2-compat, which drops injected keys and precise wheel deltas.
      - name: Use classic SDL2
        run: |
          if pacman -Q mingw-w64-ucrt-x86_64-sdl2-compat >/dev/null 2>&1; then
            pacman -Rdd --noconfirm mingw-w64-ucrt-x86_64-sdl2-compat
          fi
          curl --fail --location --retry 3 -o /tmp/SDL2-2.32.10.pkg.tar.zst \
            https://mirror.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-SDL2-2.32.10-1-any.pkg.tar.zst
          echo '9e77124b14bedaafbfb44ac26e5fb43890184db23292cebf2251b2178fad6693  /tmp/SDL2-2.32.10.pkg.tar.zst' | sha256sum -c
          pacman -U --noconfirm /tmp/SDL2-2.32.10.pkg.tar.zst
          mkdir -p /var/cache/pacman/pkg
          cp /tmp/SDL2-2.32.10.pkg.tar.zst \
            /var/cache/pacman/pkg/mingw-w64-ucrt-x86_64-SDL2-2.32.10-1-any.pkg.tar.zst
          test "$(pkg-config --modversion sdl2)" = 2.32.10
          test "$(pacman -Qoq "${MINGW_PREFIX}/bin/SDL2.dll")" = mingw-w64-ucrt-x86_64-SDL2

      - name: Configure
        run: cmake --preset windows-release -DPORTHOLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Test Windows Bluetooth sender
        shell: pwsh
        run: dotnet run --project helpers/ble-winrt/Tests --configuration Release --artifacts-path build/dotnet-tests

      - name: Package portable mirror and matching source archives
        run: bash scripts/package-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: porthole-windows-x64
          path: out/porthole-windows-x64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: porthole-windows-x64-sources
          path: out/porthole-windows-x64-sources/
          compression-level: 0
          if-no-files-found: error

  windows-minimal:
    name: Windows minimal CLI
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - run: cmake --preset release-no-airplay -DPORTHOLE_WARNINGS_AS_ERRORS=ON
      - run: cmake --build --preset release-no-airplay
      - run: ctest --preset release-no-airplay
