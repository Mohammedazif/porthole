name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (full build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo ./scripts/install-deps-linux.sh

      - name: Configure
        run: cmake --preset release -DPORTHOLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  windows:
    # Builds without the AirPlay core for now: UxPlay needs Apple's Bonjour SDK on
    # Windows, which CI can't download. This switches to the full build once
    # Porthole's native Windows mDNS backend is in (Phase 1).
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure
        run: cmake --preset release-no-airplay -DPORTHOLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset release-no-airplay

      - name: Test
        run: ctest --preset release-no-airplay

      - uses: actions/upload-artifact@v4
        with:
          name: porthole-windows-x64
          path: build/release-no-airplay/src/porthole.exe
